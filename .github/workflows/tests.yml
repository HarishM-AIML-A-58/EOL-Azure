name: Tests

# API tests run against FastAPI's TestClient with no credentials: the app
# answers from the offline catalogue. Browser tests build the SPA, start
# uvicorn, and drive it with Playwright's own Chromium. Neither job needs a
# secret, so both run the same on a fork.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            tests/requirements-test.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r tests/requirements-test.txt

      - name: Run API tests
        run: python -m pytest tests --ignore=tests/e2e -q

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          test -f ../backend/static/dist/index.html

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            tests/requirements-test.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r tests/requirements-test.txt
          python -m playwright install --with-deps chromium

      - name: Run browser tests
        run: python -m pytest tests/e2e -q --screenshot only-on-failure --output test-results

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: test-results
          if-no-files-found: ignore
          retention-days: 5
