name: Build and deploy to Azure App Service

# Deploys the monolith: the Vite bundle is built into backend/static/dist and
# FastAPI serves both the API and the SPA from one origin. That keeps the
# session cookie first-party and removes CORS from the production path.

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: lttseol-core
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend into backend/static/dist
        working-directory: frontend
        run: npm run build

      - name: Fail if the bundle is missing
        run: test -f backend/static/dist/index.html

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify backend imports
        working-directory: backend/app
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements.txt
          python -c "import app; print('backend import ok')"

      - name: Package deployment artifact
        run: |
          cd backend
          zip -r ../release.zip . \
            -x '*.pyc' \
            -x '__pycache__/*' \
            -x 'app/__pycache__/*' \
            -x 'data/*' \
            -x 'reports/*'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: release.zip
          retention-days: 5

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app

      - name: Unzip artifact
        run: unzip -q release.zip -d release

      - name: Deploy to Azure App Service
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: release

      - name: Smoke-test the health endpoint
        run: |
          # A cold slot rebuilds the virtualenv before uvicorn binds — pandas and
          # numpy alone take several minutes. Two minutes was failing the run on
          # deployments that were in fact fine, so the window is ten.
          url="${{ steps.deploy.outputs.webapp-url }}/api/health"
          for attempt in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$url" || true)
            if [ "$code" = "200" ]; then
              echo "Health check passed on attempt $attempt."
              exit 0
            fi
            echo "Attempt $attempt returned $code; the app may still be warming up."
            sleep 30
          done
          echo "Health check never returned 200."
          exit 1
